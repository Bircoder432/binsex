name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release

          cp target/${{ matrix.target }}/release/sexc \
             release/sexc-${{ matrix.suffix }}

          cp target/${{ matrix.target }}/release/binsex \
             release/binsex-${{ matrix.suffix }}

          cp target/${{ matrix.target }}/release/native \
             release/native-${{ matrix.suffix }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release

          Copy-Item "target/${{ matrix.target }}/release/sexc.exe" `
            "release/sexc-${{ matrix.suffix }}.exe"

          Copy-Item "target/${{ matrix.target }}/release/binsex.exe" `
            "release/binsex-${{ matrix.suffix }}.exe"

          Copy-Item "target/${{ matrix.target }}/release/native.exe" `
            "release/native-${{ matrix.suffix }}.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binsex-${{ matrix.suffix }}
          path: release/

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Show release files
        run: ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
